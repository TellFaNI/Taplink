<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@1,300&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Taplink</title>
  </head>
  <body>
    <div class="page-wrapper">
      <div class="header">
        <span class="text">Frontend-разработчик 💻</span>
        <p class="text-description">
          Помогаю воплотить вашу идею в полноценный сайт под ключ - любой
          сложности, в максимально короткие сроки.
        </p>
      </div>
      <!-- /.header -->
      <div class="wrapper">
        <div class="body_wrapper">
          <div class="user_container">
            <img
              width="85"
              height="85"
              class="user_avatar"
              src="img/avatar.png"
              alt="Аватарка"
            />
            <h1 class="user_name">Алина Волчёк</h1>
            <p class="user_description">Делаю сайты</p>
          </div>
          <!-- /.user_container -->
          <div class="body_container">
            <div class="buttons">
              <a href="#" class="button_twitter">
                <img src="img/Twitter.svg" alt="Twitter"
              /></a>
              <a href="#" class="button_youtube">
                <img src="img/YouTube.svg" alt="YouTube"
              /></a>
            </div>
            <!-- /.buttons -->
          </div>
          <!-- /.body_container -->
        </div>
        <!-- /.body_wrapper -->
      </div>
      <!-- /.wrapper -->
    </div>
    <!-- /.page-wrapper -->
    <script src="js/main.js"></script>
  </body>
</html>
